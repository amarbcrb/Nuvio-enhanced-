name: Build Nuvio Plus and Nuvio Pro

# Each push to main builds both editions and publishes them in one numbered release
# (v<major>.<minor>.<run number>). The in-app updater reads these releases: Nuvio Plus
# downloads NuvioPlus.apk, Nuvio Pro downloads NuvioPro.apk.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      # 0.6.4 in Version.xcconfig + run 42 -> version 0.6.42, version code 147 + 42.
      - name: Compute version
        id: version
        run: |
          marketing=$(grep '^MARKETING_VERSION=' iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          base_code=$(grep '^CURRENT_PROJECT_VERSION=' iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          version="${marketing%.*}.${GITHUB_RUN_NUMBER}"
          code=$((base_code + GITHUB_RUN_NUMBER))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $version (code $code)"

      - name: Build Nuvio Plus
        run: |
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore \
            -Pnuvio.app.versionName=${{ steps.version.outputs.name }} \
            -Pnuvio.app.versionCode=${{ steps.version.outputs.code }} \
            --stacktrace
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk NuvioPlus.apk

      # Built only once the public key from the licence generator is in
      # androidApp/src/pro/res/values/licence.xml.
      - name: Check Nuvio Pro licence key
        id: pro
        run: |
          if grep -q 'COLLE_ICI_TA_CLE_PUBLIQUE' androidApp/src/pro/res/values/licence.xml; then
            echo "::warning::Nuvio Pro not built: paste the public key from the licence generator into androidApp/src/pro/res/values/licence.xml"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Nuvio Pro
        if: steps.pro.outputs.build == 'true'
        run: |
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.edition=pro \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore \
            -Pnuvio.app.versionName=${{ steps.version.outputs.name }} \
            -Pnuvio.app.versionCode=${{ steps.version.outputs.code }} \
            --stacktrace
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk NuvioPro.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: Nuvio*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          tag="v$VERSION"
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$previous" ]; then
            changes=$(git log --no-merges --format='- %s' "$previous..HEAD" | head -n 30)
          else
            changes=$(git log -1 --format='- %s')
          fi
          {
            echo "## Téléchargement"
            echo
            echo "- **Nuvio Plus** (gratuit) : NuvioPlus.apk"
            if [ -f NuvioPro.apk ]; then
              echo "- **Nuvio Pro** (clé d'accès) : NuvioPro.apk"
            fi
            echo
            echo "## Changements"
            echo
            echo "$changes"
          } > notes.md
          gh release create "$tag" Nuvio*.apk --title "Nuvio $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest

      - name: Remove old releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old in nuvio-plus-latest nuvio-pro-latest; do
            gh release delete "$old" --cleanup-tag --yes 2>/dev/null || true
          done
          # Keep the 5 newest numbered releases.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
