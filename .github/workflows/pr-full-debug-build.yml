name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [enhanced]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      # Fixed download link for phones: the APK of the latest push replaces the previous one in
      # the nuvio-plus-latest release.
      - name: Publish APK to the nuvio-plus-latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk NuvioPlus.apk
          tag=nuvio-plus-latest
          notes="Build $RUN_NUMBER (${GITHUB_SHA::7})"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" NuvioPlus.apk --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" NuvioPlus.apk --title "Nuvio Plus" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi

      # Nuvio Pro: same app with the licence screen. Built only once the public key from the
      # licence generator is in androidApp/src/pro/res/values/licence.xml.
      - name: Check Nuvio Pro licence key
        id: pro
        run: |
          if grep -q 'COLLE_ICI_TA_CLE_PUBLIQUE' androidApp/src/pro/res/values/licence.xml; then
            echo "::warning::Nuvio Pro not built: paste the public key from the licence generator into androidApp/src/pro/res/values/licence.xml"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Nuvio Pro APK
        if: steps.pro.outputs.build == 'true'
        run: |
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.edition=pro -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk NuvioPro.apk

      - name: Upload Nuvio Pro APK
        if: steps.pro.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: NuvioPro.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to the nuvio-pro-latest release
        if: github.event_name == 'push' && steps.pro.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag=nuvio-pro-latest
          notes="Build $RUN_NUMBER (${GITHUB_SHA::7})"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" NuvioPro.apk --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" NuvioPro.apk --title "Nuvio Pro" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          fi
